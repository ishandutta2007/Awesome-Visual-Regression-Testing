<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for glowing elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="diffHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { transform: translateY(130px); opacity: 0; }
      }

      @keyframes pulseDiff {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.02); }
      }

      @keyframes floatGrid {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .scan-bar {
        animation: scanline 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .diff-box {
        transform-origin: center;
        animation: pulseDiff 2.5s ease-in-out infinite;
      }

      .floating-group {
        animation: floatGrid 6s ease-in-out infinite;
      }

      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
      }

      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
      }

      .sub-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />
  </g>

  <!-- Left Side: Title & Info -->
  <g transform="translate(60, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 48)">
      <rect width="180" height="28" rx="14" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#22c55e" />
      <text x="28" y="18" fill="#e0e7ff" font-size="12" class="badge-text" letter-spacing="0.05em">CURATED LIST &amp; GUIDE</text>
    </g>

    <!-- Main Heading -->
    <text x="0" y="125" fill="#ffffff" font-size="40" class="main-title">
      Awesome Visual Regression
    </text>
    <text x="0" y="172" fill="url(#accentGradient)" font-size="40" class="main-title" filter="url(#glow)">
      Testing &amp; UI Validation
    </text>

    <!-- Subtitle & Meta -->
    <text x="0" y="215" fill="#94a3b8" font-size="15" class="sub-title">
      Enterprise SaaS Platforms • Open-Source Frameworks • Pixel-Diff Engines • Storybook &amp; CI/CD
    </text>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 255)">
      <!-- Badge 1: Pixel Diff -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" font-size="13" class="badge-text">🔍 Pixel Diffing</text>
      </g>

      <!-- Badge 2: Visual AI -->
      <g transform="translate(142, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#ec4899" font-size="13" class="badge-text">🤖 Visual AI</text>
      </g>

      <!-- Badge 3: Cross-Browser -->
      <g transform="translate(279, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#a855f7" font-size="13" class="badge-text">🌐 Cross-Browser</text>
      </g>

      <!-- Badge 4: Storybook & CI -->
      <g transform="translate(441, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" fill="#22c55e" font-size="13" class="badge-text">⚡ CI Automation</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Graphic Visual Diff Simulator UI -->
  <g class="floating-group" transform="translate(730, 60)">
    <!-- Window Frame -->
    <rect width="410" height="230" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <rect x="75" y="10" width="160" height="16" rx="4" fill="#1e293b" />
    <text x="85" y="22" fill="#64748b" font-size="10" class="badge-text">visual-test-runner.spec.ts</text>

    <!-- Inner Comparison Split Container -->
    <g transform="translate(15, 38)">
      <!-- Baseline Canvas (Left) -->
      <rect width="180" height="160" rx="6" fill="#131d31" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" fill="#64748b" font-size="10" class="badge-text">BASELINE (v1.0)</text>
      
      <!-- Baseline UI Mockup elements -->
      <rect x="12" y="32" width="60" height="8" rx="2" fill="#3b82f6" />
      <rect x="12" y="46" width="156" height="36" rx="4" fill="#1e293b" />
      <circle cx="28" cy="64" r="10" fill="#6366f1" />
      <rect x="46" y="58" width="80" height="6" rx="2" fill="#475569" />
      <rect x="46" y="68" width="50" height="4" rx="2" fill="#334155" />
      
      <rect x="12" y="90" width="72" height="24" rx="4" fill="#22c55e" fill-opacity="0.8" />
      <rect x="94" y="90" width="74" height="24" rx="4" fill="#334155" />
      
      <rect x="12" y="124" width="156" height="22" rx="4" fill="#1e293b" />

      <!-- Comparison Canvas (Right) -->
      <g transform="translate(195, 0)">
        <rect width="180" height="160" rx="6" fill="#131d31" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="22" fill="#ec4899" font-size="10" class="badge-text">DIFF DETECTED (v1.1)</text>

        <!-- Current UI Mockup elements -->
        <rect x="12" y="32" width="60" height="8" rx="2" fill="#3b82f6" />
        <rect x="12" y="46" width="156" height="36" rx="4" fill="#1e293b" />
        <circle cx="28" cy="64" r="10" fill="#6366f1" />
        
        <!-- Shifted/Changed Title (DIFF HIGHLIGHT) -->
        <rect x="46" y="55" width="95" height="7" rx="2" fill="#ec4899" class="diff-box" filter="url(#diffHighlight)" />
        <rect x="46" y="68" width="50" height="4" rx="2" fill="#334155" />
        
        <!-- Shifted Button (DIFF HIGHLIGHT) -->
        <rect x="12" y="90" width="72" height="24" rx="4" fill="#ec4899" fill-opacity="0.8" class="diff-box" filter="url(#diffHighlight)" />
        <rect x="94" y="90" width="74" height="24" rx="4" fill="#334155" />
        
        <rect x="12" y="124" width="156" height="22" rx="4" fill="#1e293b" />

        <!-- Animated Scanner Beam -->
        <g class="scan-bar">
          <rect x="0" y="15" width="180" height="4" fill="#ec4899" filter="url(#glow)" />
          <rect x="0" y="5" width="180" height="24" fill="url(#scannerGrad)" />
        </g>
      </g>
    </g>

    <!-- Status Chip -->
    <g transform="translate(265, 202)">
      <rect width="130" height="20" rx="10" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
      <text x="10" y="14" fill="#f472b6" font-size="9" class="badge-text">⚠️ 2 Visual Regressions</text>
    </g>
  </g>
</svg>
